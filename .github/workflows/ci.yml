name: CI

on:
  push:
    branches: [main]
    # Release tags must be listed here as well: a `branches`-only filter never
    # matches a tag push, which would leave the publish job unreachable.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor declared in engines; 22 and 24 cover current LTS and latest.
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  # Publishing happens on a release tag, not on every push, so `main` can never
  # burn a version number by accident.
  publish:
    name: Publish to npm
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Verify the tag matches package.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match package version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Verify the packed tarball contents
        run: |
          npm pack --dry-run
          # The published package must not carry the source tree, tests or a
          # local config file.
          if npm pack --dry-run --json | grep -qE '"(src|test)/[a-z-]+\.(ts|js)"'; then
            echo "Tarball contains source or test files" >&2
            exit 1
          fi

      - name: Publish
        run: |
          # The version may already be on the registry when a release is cut by
          # hand rather than by tagging. Publishing the same version twice is an
          # error, so check first and skip instead of failing the run.
          # The name prefix is required: `npm view <version>` would look for a
          # package literally named "1.2.3" and always return 404.
          if npm view "$(node -p "require('./package.json').name")@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "Version $PKG_VERSION is already published to npm. Skipping."
            exit 0
          fi
          npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
